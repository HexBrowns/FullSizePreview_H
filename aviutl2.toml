#:schema ./.aviutl2-cli/aviutl2.schema.json
#
# ビルドと配布の設定（aviutl2-cli: https://github.com/sevenc-nanashi/aviutl2-cli）。
#   au2 release   ビルドして release/ に au2pkg とカタログ用の catalog.json を作る
# project.version は Cargo.toml の version と揃える。

[project]
id = "HexBrowns.FullSizePreview_H"
name = "FullSizePreview_H"
version = "0.6.1"

[artifacts."FullSizePreview_H.aux2"]
build = "cargo build --release"
source = "target/release/full_size_preview_h.dll"
destination = "Plugin/FullSizePreview_H/FullSizePreview_H.aux2"

[release]
# インストール時のダイアログに、本体と依存クレートのライセンスを出す
prebuild = ['copy /b /y LICENSE + THIRD_PARTY_CRATES.md release\package.txt >nul']
package_template = "release/package.txt"
package_information = "{name} v{version} by HexBrowns"

[catalog]
id = "HexBrowns.FullSizePreview_H"
license_path = { type = "MIT", path = "./LICENSE" }
download_repo = { owner = "HexBrowns", repo = "FullSizePreview_H" }
